name: Geo Core tests

# Run on PRs only — not on every push to main. Tag pushes already run publish-update.yml;
# a separate push-to-main test job duplicated work and slowed agent releases on Windows.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: PHPUnit (portable targeting)
        run: vendor/bin/phpunit -c phpunit.xml.dist

      - name: CLI rule evaluator regression
        run: composer test:rwgc-rule-evaluator

      - name: CLI rule condition regression
        run: composer test:rules

      - name: CLI library rule lookup
        run: composer test:library-rule-lookup

      - name: CLI visibility rule editor status
        run: composer test:visibility-rule-status

      - name: CLI GeoIP forwarding-header regression
        run: composer test:geoip-ip

      - name: CLI Elementor preview bypass regression
        run: composer test:elementor-preview-bypass

      - name: JS Elementor stale-rule panel
        run: composer test:elementor-rule-status

      - name: JS Geo Content block
        run: composer test:geo-content-block
