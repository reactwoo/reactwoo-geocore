name: Geo Core tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: PHPUnit (portable targeting)
        run: vendor/bin/phpunit -c phpunit.xml.dist

      - name: CLI rule evaluator regression
        run: composer test:rwgc-rule-evaluator

      - name: CLI rule condition regression
        run: composer test:rules
